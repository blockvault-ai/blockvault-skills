<div class="artifact-toolbar">
  <input class="artifact-search" data-search type="search" placeholder="Search hotels..." />
  <select class="artifact-sort" data-sort>
    <option value="">Sort by</option>
    <option value="rating:desc">Rating: high to low</option>
    <option value="stars:desc">Stars: high to low</option>
    <option value="name:asc">Name: A to Z</option>
  </select>
</div>
<div class="artifact-swiper" data-swiper='{"slidesPerView":1.15,"spaceBetween":12,"pagination":true}'>
  <div class="swiper-wrapper">
    {% for h in data.hotels %}
    <div class="swiper-slide" data-rating="{{ h.rating }}" data-stars="{{ h.stars }}" data-name="{{ h.name }}">
      <div class="artifact-hotel-card">
        {% if h.main_photo %}<div class="artifact-hotel-card__media"><img src="{{ h.main_photo }}" alt="{{ h.name }}" loading="lazy" decoding="async" referrerpolicy="no-referrer" /></div>{% endif %}
        <div class="artifact-hotel-card__body">
          <div class="artifact-hotel-card__title" data-searchable>{{ loop.index }}. {{ h.name }}</div>
          <div class="artifact-hotel-card__meta">
            {% if h.rating %}<span class="artifact-badge" data-searchable>{{ h.rating }} ★</span>{% endif %}
            {% if h.stars %}<span class="artifact-meta" data-searchable>{{ h.stars }} stars</span>{% endif %}
            {% if h.distance %}<span class="artifact-meta" data-searchable>{{ h.distance }} km</span>{% endif %}
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  <div class="swiper-pagination"></div>
</div>
